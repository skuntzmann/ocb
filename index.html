<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OCB">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>OCB</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.5;
    }

    button,
    .button {
      display: inline-block;
      margin: 10px 5px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      background: #222;
      color: white;
    }

    #installButton {
      display: none;
    }

    #iosHelp {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="./icons/icon-192.png" alt="OCB">

    <h1>OCB</h1>

    <p>
      Accès au Digipad OCB
    </p>

    <!-- Bouton d'installation Android / Chrome -->
    <button id="installButton">
      📱 Installer OCB
    </button>

    <!-- Ouverture du Digipad -->
    <a
      class="button"
      href="https://digipad.app/p/1234419/95149a1460b23"
      target="_blank"
      rel="noopener"
    >
      🎵 Ouvrir le Digipad
    </a>

    <!-- Explications iPhone -->
    <div id="iosHelp">

      <strong>Installer OCB sur iPhone / iPad</strong>

      <p>
        1. Appuie sur le bouton
        <strong>Partager</strong>
        de Safari.
      </p>

      <p>
        2. Choisis
        <strong>« Sur l’écran d’accueil »</strong>.
      </p>

      <p>
        3. Valide avec
        <strong>« Ajouter »</strong>.
      </p>

    </div>

  </div>

  <script>

    /*
     * Installation PWA
     */

    let deferredPrompt;

    const installButton =
      document.getElementById("installButton");

    window.addEventListener("beforeinstallprompt", event => {

      // Empêche le navigateur d'afficher automatiquement
      event.preventDefault();

      // On conserve l'événement pour plus tard
      deferredPrompt = event;

      // Affiche notre bouton
      installButton.style.display = "inline-block";

    });

    installButton.addEventListener("click", async () => {

      if (!deferredPrompt) {
        return;
      }

      // Affiche la fenêtre d'installation
      deferredPrompt.prompt();

      // Attend la réponse de l'utilisateur
      const { outcome } =
        await deferredPrompt.userChoice;

      console.log(
        "Installation PWA :",
        outcome
      );

      // L'événement ne peut être utilisé qu'une fois
      deferredPrompt = null;

      installButton.style.display = "none";

    });


    /*
     * Détection iPhone / iPad
     */

    const isIOS =
      /iphone|ipad|ipod/i.test(
        navigator.userAgent
      );

    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia(
        "(display-mode: standalone)"
      ).matches;

    if (isIOS && !isStandalone) {

      document.getElementById(
        "iosHelp"
      ).style.display = "block";

    }


  
  </script>

</body>
</html>
